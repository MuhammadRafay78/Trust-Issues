<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Trust Issues</title>
<style>
/* Layout: one landscape canvas, letterboxed; thumb pads float over the bottom corners. Bright cartoon look by choice. */
:root {
  --sky: #8fd3ff;
  --paper: #fff8e8;
  --ink: #4a2f20;
  --soft: #6b4a36;
  --orange: #ff9f43;
  --orange-d: #c76f1a;
  --green: #5fbf4a;
  --green-d: #3b8f2e;
  --font: "Baloo 2", "Arial Rounded MT Bold", ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); color: var(--ink); font-family: var(--font); -webkit-user-select: none; user-select: none; touch-action: none; -webkit-touch-callout: none; }
#wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
canvas { display: block; }
.pad { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; }
.pad.l { left: calc(16px + env(safe-area-inset-left, 0px)); }
.pad.r { right: calc(16px + env(safe-area-inset-right, 0px)); }
.pad button { width: 64px; height: 64px; border-radius: 50%; border: 3px solid rgba(74,47,32,.6); background: rgba(255,255,255,.3); display: flex; align-items: center; justify-content: center; padding: 0; touch-action: none; box-shadow: 0 4px 0 rgba(74,47,32,.35); }
.pad button svg { width: 28px; height: 28px; fill: var(--ink); pointer-events: none; }
.pad button.on { transform: translateY(3px); box-shadow: 0 1px 0 rgba(74,47,32,.35); background: rgba(255,159,67,.85); }
.pad button.jump { width: 84px; height: 84px; background: rgba(255,159,67,.7); }
.pad button.jump svg { width: 38px; height: 38px; }
.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(60,120,180,.35); overflow: auto; }
.card { background: var(--paper); border: 4px solid var(--ink); border-radius: 22px; padding: 20px 26px 22px; box-shadow: 0 8px 0 rgba(74,47,32,.35); display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: min(400px, 100%); box-sizing: border-box; text-align: center; }
.card h1 { margin: 0; font-size: 44px; line-height: .95; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; color: #fff; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); }
.card p { margin: 0; color: var(--soft); font-size: 15px; line-height: 1.35; font-weight: 600; }
.card .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn { font: 800 20px var(--font); color: #fff; background: var(--orange); border: 0; border-bottom: 6px solid var(--orange-d); border-radius: 16px; padding: 10px 30px 6px; text-shadow: 0 2px 0 rgba(0,0,0,.25); cursor: pointer; }
.btn.alt { background: var(--green); border-bottom-color: var(--green-d); }
.btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div class="pad l" id="padL" hidden>
  <button id="bL" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M16 3 6 12l10 9z"/></svg></button>
  <button id="bR" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="M8 3l10 9-10 9z"/></svg></button>
</div>
<div class="pad r" id="padR" hidden><button id="bJ" class="jump" aria-label="Jump"><svg viewBox="0 0 24 24"><path d="M12 3 3 14h6v7h6v-7h6z"/></svg></button></div>

<div class="screen" id="menu">
  <div class="card">
    <h1>Trust<br>Issues</h1>
    <p>Reach the door. Floors, spikes, ceilings and doors may be lying to you. Dying is how you learn.</p>
    <div class="row">
      <button id="play" class="btn">Play</button>
      <button id="cont" class="btn alt" hidden>Continue</button>
    </div>
  </div>
</div>

<div class="screen" id="end" hidden>
  <div class="card">
    <h1>You<br>made it</h1>
    <p id="endText"></p>
    <button id="again" class="btn">Play again</button>
  </div>
</div>

<script>
(function () {
  var T = 16, COLS = 30, ROWS = 17, W = COLS * T, H = ROWS * T;
  var SPEED = 105, JUMP = 345, GRAV = 900;

  /* ---------- Levels ---------- */
  function grid() { var g = []; for (var r = 0; r < ROWS; r++) g.push(new Array(COLS + 1).join(".").split("")); return g; }
  function level(name, build) {
    var g = grid();
    var api = {
      set: function (c, r, ch) { g[r][c] = ch; },
      row: function (r, c1, c2, ch) { for (var c = c1; c <= c2; c++) g[r][c] = ch; },
      floor: function (c1, c2) { api.row(15, c1, c2, "#"); api.row(16, c1, c2, "#"); },
      fake: function (c1, c2) { api.row(15, c1, c2, "F"); api.row(16, c1, c2, "F"); }
    };
    build(api);
    return { name: name, g: g };
  }

  var LEVELS = [
    level("Easy, right?", function (L) {
      L.floor(0, 29); L.fake(10, 13);
      L.set(2, 14, "P"); L.set(24, 14, "D");
    }),
    level("Spikes are a mood", function (L) {
      L.floor(0, 29); L.row(14, 5, 7, "X"); L.set(10, 14, "H"); L.set(16, 14, "H");
      L.set(2, 14, "P"); L.set(24, 14, "D");
    }),
    level("Look up", function (L) {
      L.floor(0, 29); L.set(10, 11, "C"); L.set(16, 11, "C"); L.set(22, 11, "C");
      L.set(2, 14, "P"); L.set(27, 14, "D");
    }),
    level("Leap of faith", function (L) {
      L.floor(0, 4); L.floor(21, 29);
      L.set(8, 13, "G"); L.set(12, 13, "G"); L.set(16, 13, "G");
      L.set(2, 14, "P"); L.set(26, 14, "D");
    }),
    level("Left is right", function (L) {
      L.floor(0, 14); L.floor(18, 21); L.floor(25, 29);
      L.set(8, 14, "Z"); L.set(2, 14, "P"); L.set(27, 14, "D");
    }),
    level("Door's shy", function (L) {
      L.floor(0, 29); L.row(14, 18, 19, "^"); L.set(25, 14, "H");
      L.set(12, 14, "R"); L.set(28, 14, "r"); L.set(2, 14, "P");
    }),
    level("The staircase", function (L) {
      L.floor(0, 29);
      L.row(12, 6, 9, "#");
      L.row(10, 12, 13, "#"); L.row(10, 14, 15, "F");
      L.row(10, 19, 22, "#"); L.set(20, 7, "C");
      L.row(9, 25, 29, "#"); L.set(26, 8, "H");
      L.set(2, 14, "P"); L.set(28, 8, "D");
    }),
    level("No hard feelings", function (L) {
      L.floor(0, 12); L.floor(16, 29);
      L.set(8, 14, "Q"); L.set(12, 14, "H");
      L.row(14, 20, 21, "^"); L.set(24, 14, "Z");
      L.set(2, 14, "P"); L.set(28, 14, "D");
    })
  ];

  var TAUNTS = [
    "Skill issue.", "The floor was fine. Then it wasn't.", "You trusted it.", "Classic.",
    "Nobody saw that.", "Again.", "It was right there.", "Bold choice.",
    "The level says hi.", "Try not dying.", "Learning, allegedly.", "Spikes: 1. You: 0."
  ];

  /* ---------- State ---------- */
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var $ = function (id) { return document.getElementById(id); };
  var mode = "menu", li = 0, deaths = 0, best = 0;
  var g, p, doors, hs, cs, zs, ftimers, shakes, falling, revealed, popped, reversed, particles, ring, msg, msgT, deadT, bannerT, tick = 0;
  var input = { l: false, r: false }, audio;
  try { best = +localStorage.getItem("trust-best") || 0; } catch (e) {}

  function beep(f, d, type) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), v = audio.createGain();
      o.type = type || "square"; o.frequency.value = f; v.gain.value = 0.035;
      o.connect(v); v.connect(audio.destination); o.start(); o.stop(audio.currentTime + d);
    } catch (e) {}
  }

  function load(i) {
    li = i; g = LEVELS[i].g.map(function (r) { return r.slice(); });
    doors = []; hs = []; cs = []; zs = [];
    ftimers = {}; shakes = {}; falling = []; revealed = {}; popped = {}; reversed = false; particles = []; ring = 0;
    msg = ""; msgT = 0; deadT = 0; bannerT = 1.6;
    var r, c, ch, k;
    for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) {
      ch = g[r][c];
      if (ch === "P") { p = { x: c * T + 3, y: (r + 1) * T - 14, w: 10, h: 14, vx: 0, vy: 0, ground: false, wasGround: false, coy: 0, buf: 0, face: 1, walkT: 0, squash: 0 }; g[r][c] = "."; }
      else if (ch === "D") { doors.push({ c: c, r: r, kind: "D" }); g[r][c] = "."; }
      else if (ch === "Q") { doors.push({ c: c, r: r, kind: "Q" }); g[r][c] = "."; }
      else if (ch === "R") { doors.push({ c: c, r: r, kind: "D", hop: true, hopped: false }); g[r][c] = "."; }
      else if (ch === "H") { hs.push({ c: c, r: r }); g[r][c] = "."; }
      else if (ch === "C") { cs.push({ c: c, r: r }); }
      else if (ch === "Z") { zs.push({ c: c, r: r }); g[r][c] = "."; }
    }
    for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) if (g[r][c] === "r") {
      g[r][c] = ".";
      for (k = 0; k < doors.length; k++) if (doors[k].hop) doors[k].dest = { c: c, r: r };
    }
    mode = "play";
  }

  /* ---------- Collision ---------- */
  function solidAt(c, r) {
    if (c < 0 || c >= COLS) return true;
    if (r < 0 || r >= ROWS) return false;
    var ch = g[r][c]; return ch === "#" || ch === "F" || ch === "G" || ch === "C";
  }
  function hitSolid(x, y, w, h) {
    var c1 = Math.floor(x / T), c2 = Math.floor((x + w - 0.001) / T), r1 = Math.floor(y / T), r2 = Math.floor((y + h - 0.001) / T);
    for (var r = r1; r <= r2; r++) for (var c = c1; c <= c2; c++) if (solidAt(c, r)) return { c: c, r: r };
    return null;
  }
  function overlap(ax, ay, aw, ah, bx, by, bw, bh) { return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by; }

  /* ---------- Rules ---------- */
  var dstyle = 0, dX = 0, dY = 0;
  function die() {
    if (mode !== "play") return;
    mode = "dead"; deadT = DUR; ring = 0; deaths++;
    dstyle = nextStyle(); var D = DEATHS[dstyle];
    dX = p.x + p.w / 2; dY = Math.min(p.y + p.h, H - 2);
    msg = D.line; msgT = 1.3;
    if (D.parts) { var cols = D.partCols || ["#ff9f43", "#ffd08a", "#ffffff", "#ff6b81"]; for (var i = 0; i < D.parts; i++) particles.push({ x: dX, y: dY - 8, vx: (Math.random() - .5) * 240, vy: -Math.random() * 240, t: 0.7, col: cols[i % cols.length] }); }
    D.snd.forEach(function (n) { setTimeout(function () { beep(n[0], n[1], n[2]); }, n[3] || 0); });
  }
  function win() {
    beep(660, 0.1); setTimeout(function () { beep(990, 0.15); }, 110);
    if (li + 1 > best) { best = li + 1; try { localStorage.setItem("trust-best", best); } catch (e) {} }
    if (li + 1 >= LEVELS.length) {
      mode = "end"; $("endText").textContent = "All " + LEVELS.length + " levels done. Deaths: " + deaths + ". Nothing was ever your fault.";
      $("end").hidden = false; $("padL").hidden = true; $("padR").hidden = true;
    } else load(li + 1);
  }

  function update(dt) {
    tick += dt;
    if (bannerT > 0) bannerT -= dt;
    if (msgT > 0) msgT -= dt;
    var i, c, r, h;
    for (i = particles.length - 1; i >= 0; i--) { var q = particles[i]; q.t -= dt; q.vy += 700 * dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.t <= 0) particles.splice(i, 1); }
    if (mode === "dead") {
      deadT -= dt; ring += dt;
      if (deadT <= 0) { var keepMsg = msg, keepT = msgT; load(li); msg = keepMsg; msgT = keepT; bannerT = 0; }
      return;
    }
    if (mode !== "play") return;

    var dir = (input.r ? 1 : 0) - (input.l ? 1 : 0); if (reversed) dir = -dir;
    p.vx = dir * SPEED; if (dir) p.face = dir;
    if (p.buf > 0) p.buf -= dt; if (p.coy > 0) p.coy -= dt;
    if (p.buf > 0 && p.coy > 0) { p.vy = -JUMP; p.buf = 0; p.coy = 0; beep(520, 0.06); }
    p.vy = Math.min(p.vy + GRAV * dt, 520);

    p.x += p.vx * dt;
    h = hitSolid(p.x, p.y, p.w, p.h);
    if (h) { if (p.vx > 0) p.x = h.c * T - p.w; else if (p.vx < 0) p.x = (h.c + 1) * T; }
    var preVy = p.vy;
    p.y += p.vy * dt; p.ground = false;
    h = hitSolid(p.x, p.y, p.w, p.h);
    if (h) { if (p.vy > 0) { p.y = h.r * T - p.h; p.ground = true; p.coy = 0.08; } else p.y = (h.r + 1) * T; p.vy = 0; }
    if (p.ground && !p.wasGround && preVy > 140) p.squash = 0.12;
    p.wasGround = p.ground;
    if (p.squash > 0) p.squash -= dt;
    if (p.ground && p.vx) p.walkT += dt;

    var cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    var c1 = Math.floor(p.x / T), c2 = Math.floor((p.x + p.w - 0.001) / T);

    // fake floors crumble shortly after being stood on
    if (p.ground) {
      var rr = Math.floor((p.y + p.h + 1) / T);
      for (c = c1; c <= c2; c++) if (g[rr] && g[rr][c] === "F" && ftimers[rr + "," + c] === undefined) ftimers[rr + "," + c] = 0.15;
    }
    for (var key in ftimers) {
      ftimers[key] -= dt;
      if (ftimers[key] <= 0) {
        var pr = key.split(","), fr = +pr[0], fc = +pr[1], cc;
        // the whole connected strip of fake tiles goes at once
        for (cc = fc; cc >= 0 && g[fr][cc] === "F"; cc--) { g[fr][cc] = "."; if (g[fr + 1] && g[fr + 1][cc] === "F") g[fr + 1][cc] = "."; }
        for (cc = fc + 1; cc < COLS && g[fr][cc] === "F"; cc++) { g[fr][cc] = "."; if (g[fr + 1] && g[fr + 1][cc] === "F") g[fr + 1][cc] = "."; }
        delete ftimers[key]; beep(160, 0.12, "triangle");
      }
    }

    // ghost blocks show themselves when touched
    for (r = Math.floor(p.y / T) - 1; r <= Math.floor((p.y + p.h) / T) + 1; r++)
      for (c = c1 - 1; c <= c2 + 1; c++)
        if (g[r] && g[r][c] === "G" && overlap(p.x - 3, p.y - 3, p.w + 6, p.h + 6, c * T, r * T, T, T)) revealed[r + "," + c] = true;

    // hidden spikes pop up when you get close
    for (i = 0; i < hs.length; i++) {
      var hh = hs[i];
      if (!hh.done && Math.abs(cx - (hh.c * T + 8)) < 20 && Math.abs(cy - (hh.r * T + 8)) < 40) { hh.done = true; g[hh.r][hh.c] = "^"; popped[hh.r + "," + hh.c] = tick; beep(300, 0.05, "sawtooth"); }
    }
    // ceiling blocks shake, then drop
    for (i = 0; i < cs.length; i++) {
      var cb = cs[i], k2 = cb.r + "," + cb.c;
      if (!cb.fired && shakes[k2] === undefined) {
        var dx = cx - (cb.c * T + 8);
        if (dx > -46 && dx < 8 && p.y > cb.r * T) shakes[k2] = 0.15;
      } else if (shakes[k2] !== undefined) {
        shakes[k2] -= dt;
        if (shakes[k2] <= 0) { delete shakes[k2]; cb.fired = true; g[cb.r][cb.c] = "."; falling.push({ x: cb.c * T, y: cb.r * T, vy: 0 }); }
      }
    }
    for (i = falling.length - 1; i >= 0; i--) {
      var f = falling[i]; f.vy += 700 * dt; f.y += f.vy * dt;
      if (overlap(p.x, p.y, p.w, p.h, f.x + 1, f.y + 1, T - 2, T - 2)) die();
      if (f.y > H + 20 || hitSolid(f.x + 2, f.y + 2, T - 4, T - 4)) { falling.splice(i, 1); beep(90, 0.1, "triangle"); }
    }
    // reverse-controls zones
    for (i = 0; i < zs.length; i++) if (!reversed && overlap(p.x, p.y, p.w, p.h, zs[i].c * T, zs[i].r * T - 8, T, T + 8)) { reversed = true; msg = "Huh?"; msgT = 1.2; beep(200, 0.2, "triangle"); }

    // spikes (real ones only; X is a harmless fake)
    for (r = Math.floor(p.y / T); r <= Math.floor((p.y + p.h - 0.001) / T); r++)
      for (c = c1; c <= c2; c++)
        if (g[r] && g[r][c] === "^" && overlap(p.x, p.y, p.w, p.h, c * T + 3, r * T + 7, 10, 9)) die();

    // doors
    for (i = 0; i < doors.length && mode === "play"; i++) {
      var d = doors[i], dcx = d.c * T + 8;
      if (d.hop && !d.hopped && d.dest && Math.abs(cx - dcx) < 44) { d.hopped = true; d.c = d.dest.c; d.r = d.dest.r; msg = "Rude."; msgT = 1; beep(740, 0.08); }
      if (overlap(p.x, p.y, p.w, p.h, d.c * T + 2, d.r * T, 12, T)) { if (d.kind === "Q") die(); else { win(); return; } }
    }
    if (mode === "play" && p.y > H + 24) die();
  }

  /* ---------- Drawing ---------- */
  var INK = "#4a2f20", FONT = "'Baloo 2', ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif";
  function hash(a, b) { var h = (a * 374761393 + b * 668265263) ^ (a * b); h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
  function rr(x, y, w, h, rad) {
    ctx.beginPath(); ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath();
  }
  function tileAt(c, r) {
    if (r < 0) return false; if (r >= ROWS) return true; if (c < 0 || c >= COLS) return true;
    var ch = g[r][c]; return ch === "#" || ch === "F" || ch === "C" || (ch === "G" && !!revealed[r + "," + c]);
  }
  function tile(x, y, c, r) {
    var up = tileAt(c, r - 1), dn = tileAt(c, r + 1), lf = tileAt(c - 1, r), rt = tileAt(c + 1, r);
    var h1 = hash(c, r), h2 = hash(r, c + 7);
    ctx.fillStyle = up ? "#8a5a3a" : "#9a6b45"; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = "#7a4d30"; ctx.beginPath(); ctx.arc(x + 3 + h1 * 10, y + 7 + h2 * 7, 1.6, 0, 6.3); ctx.fill();
    ctx.fillStyle = "#b88458"; ctx.fillRect(x + 2 + h2 * 10, y + 10 + h1 * 3, 2.5, 1.5);
    if (!up) {
      ctx.fillStyle = "#5fbf4a"; ctx.fillRect(x, y, T, 5);
      for (var i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x + 2 + i * 4, y + 5, 2.2, 0, Math.PI); ctx.fill(); }
      ctx.fillStyle = "#86d86b"; ctx.fillRect(x, y + 1, T, 1.5);
    }
    ctx.fillStyle = INK;
    if (!up) ctx.fillRect(x, y, T, 1);
    if (!dn) ctx.fillRect(x, y + T - 1, T, 1);
    if (!lf) ctx.fillRect(x, y, 1, T);
    if (!rt) ctx.fillRect(x + T - 1, y, 1, T);
  }
  function spike(x, y, k) {
    ctx.save(); ctx.translate(x, y + T); ctx.scale(1, k === undefined ? 1 : k);
    for (var i = 0; i < 2; i++) {
      var bx = i * 8;
      ctx.beginPath(); ctx.moveTo(bx + 0.5, 0); ctx.lineTo(bx + 4, -10); ctx.lineTo(bx + 7.5, 0); ctx.closePath();
      ctx.fillStyle = "#d9e2ec"; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = INK; ctx.stroke();
      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.moveTo(bx + 2, -1); ctx.lineTo(bx + 3.8, -7.5); ctx.lineTo(bx + 3.5, -1); ctx.fill();
    }
    ctx.restore();
  }
  function door(x, y) {
    ctx.save(); ctx.translate(x + 2, y);
    ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(0, 6); ctx.arc(6, 6, 6, Math.PI, 0); ctx.lineTo(12, 16); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c98a4b"; ctx.beginPath(); ctx.moveTo(1.2, 16); ctx.lineTo(1.2, 6); ctx.arc(6, 6, 4.8, Math.PI, 0); ctx.lineTo(10.8, 16); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#a8692f"; ctx.fillRect(5.6, 2, 0.9, 14);
    ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.arc(8.6, 9.5, 1.1, 0, 6.3); ctx.fill();
    ctx.restore();
  }
  function cloud(x, y, s) {

        ctx.fillRect(X - 4, bottom - 9, 8, 5); ctx.strokeRect(X - 4, bottom - 9, 8, 5);
        ctx.fillStyle = "#6b7280"; ctx.beginPath(); ctx.moveTo(X - 15, bottom - 12); ctx.lineTo(X - 10, bottom - 14); ctx.lineTo(X + 10, bottom - 14); ctx.lineTo(X + 8, bottom - 9); ctx.lineTo(X - 10, bottom - 9); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#9ca3af"; ctx.fillRect(X - 9, bottom - 13, 16, 1.5);
      } },
    { name: "glitch", line: "Lag.", snd: [[1000, .03, "square"], [300, .03, "square", 40], [1400, .03, "square", 80], [200, .05, "square", 130]],
      fx: function (t, X, Y) {
        var sd = Math.floor(t * 24), i;
        if (t < 0.65 && hash(sd, 9) < 0.7) {
          var sp = 2 + hash(sd, 1) * 3;
          figure({ x: X - sp, y: Y, body: "#00e5ff", belly: "#00e5ff", alpha: 0.55 }); figure({ x: X + sp, y: Y, body: "#ff2d6f", belly: "#ff2d6f", alpha: 0.55 });
          for (i = 0; i < 5; i++) { ctx.save(); ctx.beginPath(); ctx.rect(X - 30, Y - 22 + i * 5, 60, 5); ctx.clip(); figure({ x: X + (hash(sd, i) - .5) * 10 * (0.3 + t), y: Y, noBlink: true }); ctx.restore(); }
        }
        for (i = 0; i < 6; i++) if (hash(sd, i + 20) > .5) { ctx.fillStyle = "rgba(0,229,255,.6)"; ctx.fillRect(X - 14, Y - 22 + i * 4, 28, 1); }
        if (t > 0.65) for (i = 0; i < 8; i++) { ctx.fillStyle = "rgba(255,255,255," + (1 - t) * 1.5 + ")"; ctx.fillRect(X - 10 + hash(i, sd) * 20, Y - 20 + hash(sd, i) * 20, 2, 2); }
      } },
    { name: "moon", line: "Bonk. To the moon.", snd: [[300, .05, "square"], [1100, .3, "triangle", 80]],
      fx: function (t, X, Y) {
        var px = X + t * 220, py = Y - t * 260 + t * t * 60, s = 1 - t * 0.6, i;
        for (i = 1; i < 6; i++) { var tt = t - i * 0.04; if (tt > 0) star(X + tt * 220, Y - 8 - tt * 260 + tt * tt * 60, 3.5 * (1 - i / 6), "#ffd23f"); }
        figure({ x: px, y: py, rot: t * 25, sx: s, sy: s, xeyes: true });
        if (t > 0.7) { var q = (t - 0.7) / 0.3; star(Math.min(px, W - 16), Math.max(py, 16), 4 + Math.sin(q * Math.PI) * 10, "#fff"); }
      } },
    { name: "slice", line: "Sliced.", snd: [[1600, .06, "sawtooth"], [900, .1, "sawtooth", 60]],
      fx: function (t, X, Y) {
        if (t < 0.12) { figure({ x: X, y: Y }); ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X - 18, Y - 3); ctx.lineTo(X + 18, Y - 18); ctx.stroke(); return; }
        var q = c01((t - 0.1) / 0.9), half;
        for (half = 0; half < 2; half++) {
          ctx.save();
          if (half === 0) { ctx.translate(X - q * 14, Y - q * 8); ctx.translate(0, -9); ctx.rotate(-q * 0.8); ctx.translate(0, 9); }
          else { ctx.translate(X + q * 14, Y + q * q * 60); ctx.translate(0, -9); ctx.rotate(q * 1.2); ctx.translate(0, 9); }
          ctx.beginPath();
          if (half === 0) { ctx.moveTo(-14, -30); ctx.lineTo(14, -30); ctx.lineTo(14, -2); ctx.lineTo(-14, -16); }
          else { ctx.moveTo(-14, -16); ctx.lineTo(14, -2); ctx.lineTo(14, 4); ctx.lineTo(-14, 4); }
          ctx.closePath(); ctx.clip(); ctx.globalAlpha = 1 - q * 0.5;
          figure({ x: 0, y: 0, xeyes: half === 0, noBlink: true });
          ctx.restore();
        }
      } },
    { name: "deflate", line: "Pfffft.", snd: [[900, .1, "sine"], [700, .15, "sine", 100], [400, .3, "sine", 250]],
      fx: function (t, X, Y) {
        var k = 1 - t, sc = 1 - 0.5 * ease(t);
        figure({ x: X + Math.sin(t * 18) * 30 * k, y: Y - Math.abs(Math.sin(t * 9)) * 40 * k, rot: Math.sin(t * 20) * 0.8 * k, sx: sc * (1 + 0.2 * t), sy: sc * (1 - 0.3 * t), xeyes: t > 0.6 });
        for (var i = 0; i < 3; i++) { var q = (t * 4 + i / 3) % 1; if (t < 0.8) dot(X + Math.sin(t * 18) * 30 * k - 8 - q * 8, Y - 10 - q * 6, 1.5, "#fff", (1 - q) * 0.8); }
      } }
  ];
  var bag = [], lastStyle = -1;
  function nextStyle() {
    if (!bag.length) { for (var i = 0; i < DEATHS.length; i++) bag.push(i); for (i = bag.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp; } if (bag[bag.length - 1] === lastStyle) bag.unshift(bag.pop()); }
    lastStyle = bag.pop(); return lastStyle;
  }

  function pill(text, x, y, align, size) {
    ctx.font = "800 " + size + "px " + FONT; ctx.textBaseline = "middle";
    var w = ctx.measureText(text).width + 14, h = size + 8, px = align === "right" ? x - w : align === "center" ? x - w / 2 : x;
    rr(px, y, w, h, h / 2); ctx.fillStyle = "rgba(255,248,232,.95)"; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = INK; ctx.textAlign = "left"; ctx.fillText(text, px + 7, y + h / 2 + 0.5);
  }
  function banner(text, y, alpha) {
    ctx.font = "800 24px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineJoin = "round"; ctx.lineWidth = 6; ctx.strokeStyle = "rgba(74,47,32," + alpha + ")"; ctx.strokeText(text, W / 2, y);
    ctx.fillStyle = "rgba(255,255,255," + alpha + ")"; ctx.fillText(text, W / 2, y);
  }
  function draw() {
    var D = mode === "dead" ? DEATHS[dstyle] : null;
    ctx.save();
    if (D && D.shake) { var amp = D.shake * Math.max(0, 1 - ring / 0.5); ctx.translate((Math.random() - .5) * amp * 2, (Math.random() - .5) * amp * 2); }
    background();
    if (!g) return;
    var r, c, ch, i, x, y, k;
    for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) {
      ch = g[r][c]; x = c * T; y = r * T;
      if (ch === "#" || ch === "F") tile(x, y, c, r);
      else if (ch === "C") { var s = shakes[r + "," + c]; tile(x + (s !== undefined ? Math.sin(tick * 90) * 1.5 : 0), y, c, r); }
      else if (ch === "G" && revealed[r + "," + c]) tile(x, y, c, r);
      else if (ch === "X") spike(x, y);
      else if (ch === "^") {
        k = popped[r + "," + c]; if (k !== undefined) { k = Math.min(1, (tick - k) / 0.12); k = k < 1 ? 1 + 0.25 * Math.sin(k * Math.PI) * (1 - k) + (k - 1) * 0 : 1; k = Math.max(0.05, Math.min(1.15, (tick - popped[r + "," + c]) / 0.1)); if (k > 1) k = 1; }
        spike(x, y, k);
      }
    }
    for (i = 0; i < doors.length; i++) door(doors[i].c * T, doors[i].r * T);
    for (i = 0; i < falling.length; i++) tile(falling[i].x, falling[i].y, -1, -1);
    if (D) D.fx(c01(ring / DUR), dX, dY);
    for (i = 0; i < particles.length; i++) { ctx.fillStyle = particles[i].col; ctx.beginPath(); ctx.arc(particles[i].x, particles[i].y, 2.6, 0, 6.3); ctx.fill(); ctx.lineWidth = 0.8; ctx.strokeStyle = INK; ctx.stroke(); }
    if (mode === "play" || mode === "end" || mode === "menu") drawPlayer();
    ctx.restore();
    pill((li + 1) + "/" + LEVELS.length + "  " + LEVELS[li].name, 8, 6, "left", 11);
    pill("Deaths " + deaths, W - 8, 6, "right", 11);
    if (msgT > 0 && msg) pill(msg, W / 2, 30, "center", 14);
    if (bannerT > 0 && mode === "play") banner(LEVELS[li].name, 78, Math.min(1, bannerT));
  }

  /* ---------- Loop & sizing ---------- */
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight, scale = Math.min(vw / W, vh / H);
    var d = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = W * scale + "px"; cv.style.height = H * scale + "px";
    cv.width = Math.round(W * scale * d); cv.height = Math.round(H * scale * d);
    ctx.setTransform(scale * d, 0, 0, scale * d, 0, 0); ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener("resize", resize);
  var last = performance.now(), paused = false;
  function frame(t) {
    var dt = Math.min((t - last) / 1000, 1 / 30); last = t;
    if (!paused) update(dt);
    draw(); requestAnimationFrame(frame);
  }

  /* ---------- Input ---------- */
  function jump() { if (p) p.buf = 0.1; }
  function bind(id, on, off) {
    var el = $(id);
    el.addEventListener("pointerdown", function (e) { e.preventDefault(); el.classList.add("on"); on(); });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (n) { el.addEventListener(n, function () { el.classList.remove("on"); off(); }); });
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  }
  bind("bL", function () { input.l = true; }, function () { input.l = false; });
  bind("bR", function () { input.r = true; }, function () { input.r = false; });
  bind("bJ", jump, function () {});
  var KEYS = { ArrowLeft: "l", KeyA: "l", ArrowRight: "r", KeyD: "r" };
  window.addEventListener("keydown", function (e) {
    if (KEYS[e.code]) { input[KEYS[e.code]] = true; e.preventDefault(); }
    else if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { if (!e.repeat) jump(); e.preventDefault(); }
    else if (e.code === "KeyR" && mode === "play") { die(); }
  });
  window.addEventListener("keyup", function (e) { if (KEYS[e.code]) input[KEYS[e.code]] = false; });
  window.addEventListener("blur", function () { input.l = input.r = false; });

  function startAt(i) { $("menu").hidden = true; $("end").hidden = true; $("padL").hidden = false; $("padR").hidden = false; load(i); }
  $("play").addEventListener("click", function () { deaths = 0; startAt(0); });
  $("cont").addEventListener("click", function () { startAt(Math.min(best, LEVELS.length - 1)); });
  $("again").addEventListener("click", function () { deaths = 0; startAt(0); });
  if (best > 0 && best < LEVELS.length) $("cont").hidden = false;

  // Test hook: lets a headless bot step the simulation deterministically.
  window.__trust = {
    reset: function (i) { paused = true; deaths = 0; $("menu").hidden = true; load(i); bannerT = 0; },
    forceDeath: function (i) { bag = [i]; }, step: function (l, r, j, dt) { input.l = l; input.r = r; if (j) jump(); update(dt); return { mode: mode, li: li, x: p.x, y: p.y }; }
  };
  resize(); load(0); mode = "menu"; requestAnimationFrame(frame);
})();
</script>
