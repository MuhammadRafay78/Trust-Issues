/* Layout: one landscape canvas, letterboxed; thumb pads float over the bottom corners. Bright cartoon look by choice. */
:root {
  --sky: #8fd3ff;
  --paper: #fff8e8;
  --ink: #4a2f20;
  --soft: #6b4a36;
  --orange: #ff9f43;
  --orange-d: #c76f1a;
  --green: #5fbf4a;
  --green-d: #3b8f2e;
  --b: clamp(60px, 20vh, 92px);
  --font: "Baloo 2", "Arial Rounded MT Bold", ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); color: var(--ink); font-family: var(--font); -webkit-user-select: none; user-select: none; touch-action: none; -webkit-touch-callout: none; }
#wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
canvas { display: block; }
.pad { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; }
.pad.l { left: calc(14px + env(safe-area-inset-left, 0px)); }
.pad.r { right: calc(14px + env(safe-area-inset-right, 0px)); }
.nopad .pad { visibility: hidden; }
.pad button { width: var(--b); height: var(--b); border-radius: 50%; border: 3px solid rgba(74,47,32,.6); background: rgba(255,255,255,.3); display: flex; align-items: center; justify-content: center; padding: 0; touch-action: none; box-shadow: 0 4px 0 rgba(74,47,32,.35); }
.pad button svg { width: calc(var(--b) * .43); height: calc(var(--b) * .43); fill: var(--ink); pointer-events: none; }
.pad button.on { transform: translateY(3px); box-shadow: 0 1px 0 rgba(74,47,32,.35); background: rgba(255,159,67,.85); }
.pad button.jump { width: calc(var(--b) * 1.18); height: calc(var(--b) * 1.18); background: rgba(255,159,67,.7); }
.pad button.jump svg { width: calc(var(--b) * .54); height: calc(var(--b) * .54); }
.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(60,120,180,.35); overflow: auto; }
.card { background: var(--paper); border: 4px solid var(--ink); border-radius: 22px; padding: 20px 26px 22px; box-shadow: 0 8px 0 rgba(74,47,32,.35); display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: min(400px, 100%); box-sizing: border-box; text-align: center; }
.card h1 { margin: 0; font-size: 44px; line-height: .95; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; color: #fff; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); }
.card p { margin: 0; color: var(--soft); font-size: 15px; line-height: 1.35; font-weight: 600; }
.card .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn { font: 800 20px var(--font); color: #fff; background: var(--orange); border: 0; border-bottom: 6px solid var(--orange-d); border-radius: 16px; padding: 10px 30px 6px; text-shadow: 0 2px 0 rgba(0,0,0,.25); cursor: pointer; }
.btn.alt { background: var(--green); border-bottom-color: var(--green-d); }
.btn:active { transform: translateY(3px); border-bottom-width: 3px; }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.card .col { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.btn.alt2 { background: #6c8cff; border-bottom-color: #4a62c4; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.small { font-size: 16px; padding: 8px 18px 5px; }
.card h1.small { font-size: 32px; }
#levels .card { width: min(560px, 100%); max-width: min(560px, 100%); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; width: 100%; max-height: 44vh; overflow: auto; padding: 4px; box-sizing: border-box; }
.grid button { font: 800 16px var(--font); color: #fff; border: 0; border-bottom: 4px solid; border-radius: 10px; padding: 9px 0 6px; cursor: pointer; background: var(--green); border-bottom-color: var(--green-d); }
.grid button.cur { background: var(--orange); border-bottom-color: var(--orange-d); }
.grid button:disabled { background: #b9b2a6; border-bottom-color: #8f887c; cursor: default; opacity: .8; }
.hudbtn { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(74,47,32,.75); background: rgba(255,248,232,.92); display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0; box-shadow: 0 3px 0 rgba(74,47,32,.35); cursor: pointer; }
.hudbtn i { display: block; width: 5px; height: 16px; background: var(--ink); border-radius: 2px; }
.hudbtn.skip { top: calc(62px + env(safe-area-inset-top, 0px)); width: auto; height: auto; border-radius: 14px; padding: 8px 16px 5px; font: 800 15px var(--font); color: #fff; background: #6c8cff; border: 0; border-bottom: 5px solid #4a62c4; box-shadow: none; }
.hudbtn svg { width: 22px; height: 22px; fill: var(--ink); pointer-events: none; }
.nopad .hudbtn { display: none; }
@media (orientation: landscape) {
  /* the side columns are empty above the buttons: keep the pause and skip buttons out of the game view */
  .hudbtn { left: auto; right: calc(40px + env(safe-area-inset-right, 0px)); transform: none; }
  .hudbtn.restart { right: calc(92px + env(safe-area-inset-right, 0px)); }
  .hudbtn.skip { right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(64px + env(safe-area-inset-top, 0px)); padding: 7px 12px 4px; font-size: 14px; }
  .grid { max-height: min(300px, 59vh); }
  .grid button { padding: 6px 0 4px; font-size: 15px; }
}
.card canvas.art { width: 130px; height: 55px; margin: -4px 0 -2px; }

      scale = Math.max(ah / (13 * T), aw / W);
    }
    viewW = aw / scale; viewH = ah / scale;
    var d = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = aw + "px"; cv.style.height = ah + "px";

  }
  function camTarget() {

  function snapCam() { var t = camTarget(); camX = t[0]; camY = t[1]; }

  window.addEventListener("resize", resize); window.addEventListener("orientationchange", function () { setTimeout(resize, 150); });
  var last = performance.now(), paused = false;
  function frame(t) {
    var dt = Math.min((t - last) / 1000, 1 / 30); last = t;
    if (!paused && !uiOpen) { syncInput(); update(dt); }
    stepCam(dt); draw();
    if (!$("menu").hidden) paintArt("menuArt", false); else if (!$("end").hidden) paintArt("endArt", true); else if (!$("wardrobe").hidden) paintArt("wardArt", false);
    requestAnimationFrame(frame);
  }

  /* ---------- Input ---------- */
  function jump() { if (p) p.buf = 0.14; }
  // Touch pads: the whole bottom bar is split into three big touch zones (left / right / jump) with no dead gaps,
  // and a quick tap is held for a moment so it is never lost between two frames.
  var BTNS = [["L", "bL"], ["R", "bR"], ["J", "bJ"]], held = {}, kb = { l: false, r: false }, hold = { l: 0, r: 0 }, MINHOLD = 95;
  function padHit(x, y) {
    if (uiOpen || document.body.classList.contains("nopad")) return null;
    var L = $("bL").getBoundingClientRect(), R = $("bR").getBoundingClientRect(), J = $("bJ").getBoundingClientRect(), ext = 48;
    if (y < Math.min(L.top, R.top, J.top) - 140) return null;
    var bLR = (L.right + R.left) / 2, bRJ = (R.right + J.left) / 2;
    if (x < bLR) return x >= L.left - ext ? "L" : null;

    return x >= J.left - ext ? "J" : null;
  }
  function syncInput() {
    var on = {}, id, now = performance.now(); for (id in held) if (held[id]) on[held[id]] = true;
    input.l = kb.l || !!on.L || now < hold.l; input.r = kb.r || !!on.R || now < hold.r;
    BTNS.forEach(function (b) { $(b[1]).classList.toggle("on", !!on[b[0]] || (b[0] === "L" && now < hold.l) || (b[0] === "R" && now < hold.r)); });
  }
  function applyHeld() {
    var now = performance.now(), id; for (id in held) { if (held[id] === "L") hold.l = now + MINHOLD; if (held[id] === "R") hold.r = now + MINHOLD; }

  window.addEventListener("pointerup", release); window.addEventListener("pointercancel", release);
  window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  var KEYS = { ArrowLeft: "l", KeyA: "l", ArrowRight: "r", KeyD: "r" };
  window.addEventListener("keydown", function (e) {

    else if (e.code === "KeyR" && mode === "play") { die(); }
  });
  window.addEventListener("keyup", function (e) { if (KEYS[e.code]) { kb[KEYS[e.code]] = false; syncInput(); } });
  window.addEventListener("blur", function () { held = {}; kb.l = kb.r = false; hold.l = hold.r = 0; syncInput(); });

  function startAt(i) { $("menu").hidden = true; $("end").hidden = true; $("levels").hidden = true; $("pause").hidden = true; uiOpen = false; document.body.classList.remove("nopad"); resize(); enter(i); }
  $("play").addEventListener("click", function () { deaths = 0; startAt(0); });
  $("cont").addEventListener("click", function () { startAt(Math.min(best, LEVELS.length - 1)); });
  $("again").addEventListener("click", function () { deaths = 0; startAt(0); });
  if (best > 0 && best < LEVELS.length) $("cont").hidden = false;
  menuStats();

  // Test hook: lets a headless bot step the simulation deterministically.
  function openPause() {
    if (uiOpen || (mode !== "play" && mode !== "dead")) return;
    uiOpen = true; held = {}; applyHeld(); document.body.classList.add("nopad"); $("pause").hidden = false;
    var can = lvDeaths >= 3; $("skip").disabled = !can;
    $("skip").textContent = can ? "Skip this level (watch an ad)" : "Skip unlocks after 3 deaths (" + lvDeaths + "/3)";
  }
  function closeMenus() { uiOpen = false; $("pause").hidden = true; $("levels").hidden = true; document.body.classList.remove("nopad"); }
  function openLevels(from) {
    levelsFrom = from; var grid = $("lvGrid"); grid.innerHTML = "";
    var open = Math.min(best, LEVELS.length - 1);
    LEVELS.forEach(function (lv, i) {
      if (i === 0 || CHAPTERS.some(function (c) { return c.from === i; })) {
        var ch = document.createElement("div"); ch.className = "chap"; ch.textContent = CHAPTERS[chapterOf(i)].name; grid.appendChild(ch);
      }
      var b = document.createElement("button"), n = stars[i] || 0;
      b.textContent = i + 1; b.title = lv.name;
      var sm = document.createElement("small"); sm.textContent = n ? new Array(n + 1).join("\u2605") + new Array(4 - n).join("\u2606") : "\u2606\u2606\u2606"; b.appendChild(sm);
      if (i === open) b.className = "cur"; // every level is open to try, in any order
      b.addEventListener("click", function () { closeMenus(); startAt(i); });
      grid.appendChild(b);
    });
    $("menu").hidden = true; $("pause").hidden = true; $("levels").hidden = false;
    if (from === "menu") { uiOpen = false; }
  }
  $("pauseBtn").addEventListener("click", openPause);
  $("restartBtn").addEventListener("click", function () { if (mode === "play") die(); });
  $("resume").addEventListener("click", closeMenus);
  $("restart").addEventListener("click", function () { closeMenus(); var keep = lvDeaths; enter(li); lvDeaths = keep; bannerT = 0; });
  $("skip").addEventListener("click", function () { if (lvDeaths < 3) return; askSkip(); });
  $("skipBtn").addEventListener("click", function () { askSkip(); });
  $("lvlBtn").addEventListener("click", function () { openLevels("menu"); });
  $("lvlBtn2").addEventListener("click", function () { openLevels("pause"); });
  $("lvBack").addEventListener("click", function () { $("levels").hidden = true; if (levelsFrom === "menu") { $("menu").hidden = false; menuStats(); } else $("pause").hidden = false; });
  window.addEventListener("keydown", function (e) { if (e.code === "Escape") { if (uiOpen && !$("pause").hidden) closeMenus(); else openPause(); } });

  window.__trust = {
    reset: function (i) { paused = true; deaths = 0; $("menu").hidden = true; load(i); bannerT = 0; },
    forceDeath: function (i) { bag = [i]; },
    count: function () { return LEVELS.length; },
    view: function () { return [dX, dY, camX, camY, baseScale]; },
    snap: function () { return JSON.stringify([g, p, doors, hs, cs, zs, ftimers, shakes, falling, revealed, popped, reversed, tick, mode, li, hearts, tr]); },
    restore: function (t) { var a = JSON.parse(t); g = a[0]; p = a[1]; doors = a[2]; hs = a[3]; cs = a[4]; zs = a[5]; ftimers = a[6]; shakes = a[7]; falling = a[8]; revealed = a[9]; popped = a[10]; reversed = a[11]; tick = a[12]; mode = a[13]; li = a[14]; hearts = a[15]; tr = a[16]; particles = []; },
    key: function () { return [Math.round(p.x / 3), Math.round(p.y / 3), Math.round(p.vy / 80), periodic() ? Math.round((tick % 4.8) * 10) : 0, tr.map(function (q) { return q.t0 === null ? "n" : q.i + ":" + Math.min(40, Math.round((tick - q.t0) * 10)); }).join("|"), reversed ? 1 : 0, Object.keys(ftimers).length, Object.keys(popped).length, falling.length, hs.filter(function (h) { return h.done; }).length, cs.filter(function (c) { return c.fired; }).length, doors.map(function (d) { return d.hopN || 0; }).join(""), Math.round(p.vx / 30), g.reduce(function (n, row) { return n + row.filter(function (ch) { return ch === "M"; }).length; }, 0), Object.keys(revealed).length, zs.filter(function (z) { return z.done; }).length, hearts.filter(function (h) { return h.got; }).length].join(","); },
    hearts: function () { return hearts.length; }, dump: function (i) { return LEVELS[i].g.map(function (r) { return r.join(""); }).join("\n") + "\n" + JSON.stringify(LEVELS[i].crit); },
    goal: function () { var d = doors.filter(function (q) { return q.kind === "D"; })[0], f = d.dests && d.dests.length ? d.dests[d.dests.length - 1] : d; return { x: f.c * T + 8, y: f.r * T + 8 }; },
    addLevel: function (name, rows, tip) {
      var lv = { name: name, g: rows.map(function (r) { return r.split(""); }), crit: [], tip: tip || "" };

    periodic: function () { return periodic(); },
    targets: function () {

      if (!t.length) { var d = doors.filter(function (q) { return q.kind === "D"; })[0], f = d.dests && d.dests.length ? d.dests[d.dests.length - 1] : d; t.push({ x: f.c * T + 8, y: f.r * T + 8 }); }

    },
    nasty: function (i, ops) { NASTY[i] = ops; applyNasty(i); }, baseDump: function (i) { return LEVELS[i].base.map(function (r) { return r.join(""); }).join("\n") + "\n" + JSON.stringify(LEVELS[i].baseCrit); }, pos: function () { return p ? p.x : -1; }, step: function (l, r, j, dt) { input.l = l; input.r = r; if (j) jump(); update(dt); return { mode: mode, li: li, x: p.x, y: p.y, tick: tick, rev: reversed, ground: p.ground }; }
  };
  resize(); load(0); mode = "menu"; requestAnimationFrame(frame);
})();
</script>
